# ~/.tmux.conf - practical daily configuration.
 
# ---- Prefix ----
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
 
# ---- General ----
set -g history-limit 50000
set -g mouse on
set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on
set -g set-clipboard on            # OSC52: copy works inside SSH sessions too
set -g display-time 2000
setw -g aggressive-resize on       # grouped sessions across monitors
set -g detach-on-destroy off       # closing a session switches to another
 
# ---- Key Bindings ----
bind r source-file ~/.tmux.conf \; display "Reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
 
# Prefix-free navigation (Alt + hjkl / Alt + number)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
 
bind s choose-tree -Zs             # zoomed session/window picker
bind S setw synchronize-panes \; display "Sync #{?synchronize-panes,ON,off}"
 
# ---- Agent Monitoring ----
# Visual-only: tmux shows a message and colors the window, never beeps
set -g monitor-bell on
set -g bell-action other
set -g visual-bell on
set -g silence-action other
set -g visual-silence on
setw -g window-status-bell-style fg=black,bg=red,bold
setw -g window-status-activity-style fg=black,bg=yellow
 
# Toggle "alert when this window is quiet for 30s" (agent done or waiting)
bind M if -F "#{monitor-silence}" \
  "setw monitor-silence 0 ; display 'Silence watch off'" \
  "setw monitor-silence 30 ; display 'Silence watch on'"
 
# ---- Popups ----
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit
bind D display-popup -w 90% -h 80% -E "psql service=prod_ro"
bind t display-popup -d "#{pane_current_path}" -w 80% -h 70%
 
# ---- Logging / Postmortems ----
run-shell "mkdir -p ~/tmux-logs"
bind C-s run-shell "tmux capture-pane -pS - -t '#{pane_id}' > ~/tmux-logs/#{session_name}-#{window_name}-$(date +%s).txt" \; display "Scrollback saved"
bind P pipe-pane -o "cat >> ~/tmux-logs/#{session_name}-#{window_name}.log" \; display "Logging toggled"
 
# ---- Copy Mode ----
setw -g mode-keys vi
bind v copy-mode
bind / copy-mode \; send-keys ?    # jump straight to searching scrollback
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"
 
# ---- Pane Borders ----
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_current_command} #[dim]#{b:pane_current_path} "
set -g pane-active-border-style fg=yellow
 
# ---- Status Bar ----
set -g status-interval 5
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green,bold][#S] "
set -g status-left-length 30
set -g status-right "#[fg=magenta]#H #[fg=cyan]%H:%M %d-%b"
set -g status-justify left
setw -g window-status-current-style fg=yellow,bold
 
# Windows running ssh turn red so production shells are unmistakable
setw -g window-status-format "#{?#{==:#{pane_current_command},ssh},#[bg=red#,fg=white#,bold],} #I:#W "
setw -g window-status-current-format "#{?#{==:#{pane_current_command},ssh},#[bg=red#,fg=white#,bold],#[fg=yellow#,bold]} #I:#W* "
 
# ---- Plugins (TPM) ----
# Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press prefix + I inside tmux
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
 
# Keep this as the very last line
run '~/.tmux/plugins/tpm/tpm'